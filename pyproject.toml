[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-ledger"
version = "0.1.0a1"
description = "Tamper-evident append-only SHA-256 provenance and audit ledger for autonomous agents."
readme = "README.md"
authors = [
    { name = "Perseus Computing LLC", email = "contact@perseuscomputing.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Perseus-Computing-LLC/argus"
Repository = "https://github.com/Perseus-Computing-LLC/argus"
