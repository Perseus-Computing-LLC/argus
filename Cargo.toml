[package]
name = "argus-ledger"
version = "0.1.0-alpha.8"
edition = "2021"
rust-version = "1.88"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
description = "Tamper-evident append-only SHA-256 provenance and audit ledger for autonomous agents."
license = "MIT"
homepage = "https://telarch.ai/argus"
documentation = "https://docs.rs/argus-ledger"
repository = "https://github.com/Perseus-Computing-LLC/argus"
readme = "README.md"
keywords = ["ai", "agents", "cognitive", "telarch"]
categories = ["development-tools"]

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
getrandom = "0.4"
# float_roundtrip: parse floats correctly rounded, so a payload written by the Python library
# (repr: shortest round-trip) re-serializes to the same bytes and the event hash reproduces.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }

[[bin]]
name = "argus-verify"
path = "src/bin/argus_verify.rs"
