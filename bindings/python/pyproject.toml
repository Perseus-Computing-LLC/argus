[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "argus-ledger-native"
version = "0.1.0a8"
description = "Python extension exposing the argus-ledger Rust chain verifier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
]

[tool.maturin]
module-name = "argus_ledger_native"
