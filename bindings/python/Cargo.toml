[package]
name = "argus-ledger-native"
version = "0.1.0-alpha.8"
edition = "2021"
rust-version = "1.88"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
description = "Python extension exposing the argus-ledger Rust chain verifier (one verifier, two languages)."
license = "MIT"
repository = "https://github.com/Perseus-Computing-LLC/argus"
publish = false

[lib]
name = "argus_ledger_native"
crate-type = ["cdylib"]

[dependencies]
argus-ledger = { path = "../.." }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
