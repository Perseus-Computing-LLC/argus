name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-rust-stable:
    name: Rust Stable (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & doc tests
        run: cargo test --verbose

  test-rust-msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: "1.88.0"

      - name: Cargo test on locked MSRV
        run: cargo test --locked --verbose

  test-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic cryptography pytest hatchling build

      # The cross-language tests (tests/test_file_ledger_cross.py, tests/test_cross_verifier_matrix.py)
      # need rustc, target/{debug,release}/libargus_ledger.rlib and target/release/argus-verify.
      # Without them they skip on a developer machine; in CI (CI=true) they fail instead, so the
      # Python/Rust byte-for-byte agreement is checked on every run.
      - name: Set up Rust toolchain for the cross-language tests
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: 1.97.1

      - name: Build the Rust crate (debug and release)
        run: |
          cargo build --locked
          cargo build --locked --release

      # The native-verifier tests (tests/test_native_verifier.py, the python_native column of the
      # matrix) need the argus_ledger_native extension importable. Built as a wheel from
      # bindings/python and installed into the test interpreter; under CI=true a missing
      # extension fails those tests instead of skipping them.
      - name: Build and install the argus_ledger_native extension
        shell: bash
        run: |
          pip install maturin
          (cd bindings/python && maturin build --release --locked --out "$RUNNER_TEMP/native-wheel")
          pip install "$RUNNER_TEMP"/native-wheel/*.whl
          python -c "import argus_ledger_native as n; print('argus_ledger_native', n.crate_version())"

      # Installs the built wheel the way a user would: dependencies resolved from PyPI, no --no-deps.
      - name: Install the wheel with its dependencies in a clean venv
        shell: bash
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import platform, argus_ledger; print(platform.system(), platform.machine(), 'argus_ledger', argus_ledger.__version__)"

      - name: Run pytest
        run: |
          pytest tests -v
